<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fig Brackeys Platformer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: #101418;
        color: #e7eef5;
        overflow: hidden;
      }

      .shell {
        display: grid;
        grid-template-rows: 44px minmax(0, 1fr);
        min-height: 100%;
      }

      .bar {
        align-items: center;
        background: #171d22;
        border-bottom: 1px solid #2b3740;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 0 16px;
      }

      .title {
        font-size: 14px;
        font-weight: 650;
      }

      .meters {
        color: #9fb2c4;
        display: flex;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        gap: 14px;
      }

      .stage {
        background: #101820;
        box-sizing: border-box;
        display: grid;
        min-height: 0;
        padding: 16px;
        place-items: center;
      }

      canvas {
        background: #17202a;
        border: 4px solid #05080b;
        box-sizing: content-box;
        display: block;
        height: auto;
        image-rendering: pixelated;
        outline: none;
        width: 1152px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <div class="title">Fig Brackeys Platformer</div>
        <div class="meters" aria-live="polite">
          <span id="axis">axis 0</span>
          <span id="jump">jump 0</span>
          <span id="coins">coins 0</span>
          <span id="frame">dt 16</span>
        </div>
      </header>
      <div class="stage">
        <canvas id="game" tabindex="0" width="1152" height="648"></canvas>
      </div>
    </main>

    <script type="module">
      const VIEW_W = 288;
      const VIEW_H = 162;
      const CAMERA_OFFSET_Y = 21;
      const CAMERA_LIMIT_BOTTOM = 280;
      const CULL_PAD = 16;
      const MAX_SCALE = 4;
      const STAGE_PAD = 32;
      const CANVAS_BORDER = 8;
      const HOT_RELOAD_MS = 750;

      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d", { alpha: false });
      const axisMeter = document.querySelector("#axis");
      const jumpMeter = document.querySelector("#jump");
      const coinMeter = document.querySelector("#coins");
      const frameMeter = document.querySelector("#frame");

      const inputKeys = new Map([
        ["ArrowLeft", 1],
        ["KeyA", 1],
        ["ArrowRight", 2],
        ["KeyD", 2],
        ["Space", 3],
        ["KeyW", 3],
        ["ArrowUp", 3],
        ["KeyR", 4],
      ]);
      let viewport = { x: 0, y: 0, scale: 1 };
      let camera = { x: 0, y: 0 };
      let exports;
      let world;
      let lastDt = 16;
      let lastFrame = performance.now();
      let wasmSignature = "";
      let reloadPending = false;
      let replayLog = [];
      let hmrSocket;
      let hmrFallbackTimer;

      const atlas = new Map();
      const atlasSources = new Map([
        [1, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/world_tileset.png"],
        [2, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/knight.png"],
        [3, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/coin.png"],
        [4, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/fruit.png"],
        [5, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/slime_green.png"],
        [6, "../brackeys_fig_platformer/brackeys_platformer_assets/sprites/platforms.png"],
      ]);

      function applyKeyInput(key, down, record = true) {
        if (!exports || !world) return;
        world = exports.input_key(...world, key, down);
        if (record) replayLog.push({ kind: "key", key, down });
      }

      function applyPointerInput(axis, jump, active, record = true) {
        if (!exports || !world) return;
        world = exports.input_pointer(...world, axis, jump, active);
        if (record) replayLog.push({ kind: "pointer", axis, jump, active });
      }

      addEventListener("keydown", (event) => {
        const key = inputKeys.get(event.code);
        if (!key) return;
        event.preventDefault();
        applyKeyInput(key, 1);
      });

      addEventListener("keyup", (event) => {
        const key = inputKeys.get(event.code);
        if (!key) return;
        event.preventDefault();
        applyKeyInput(key, 0);
      });

      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture(event.pointerId);
        const bounds = canvas.getBoundingClientRect();
        const jump = event.clientY < bounds.top + canvas.clientHeight / 2 ? 1 : 0;
        const axis = event.clientX >= bounds.left + canvas.clientWidth / 2 ? 1 : -1;
        applyPointerInput(axis, jump, 1);
      });

      canvas.addEventListener("pointerup", (event) => {
        canvas.releasePointerCapture(event.pointerId);
        applyPointerInput(0, 0, 0);
      });

      function hostImports() {
        return {
          env: {
            canvas_init: () => 1,
            gpu_create_shader: () => 1,
            gpu_create_pipeline: () => 1,
            gpu_upload_vertices: () => 1,
            gpu_draw_quads: () => 1,
            gpu_draw_rect: () => 1,
            event_poll: () => 0,
            gpu_begin_frame: (_target, _width, _height) => {
              updateCamera();
              viewport = drawBackdrop();
              return 1;
            },
            gpu_draw_sprite: (_canvas, atlasId, sx, sy, sw, sh, dx, dy, dw, dh, flipX) => {
              if (
                dx + dw < camera.x - CULL_PAD || dx > camera.x + VIEW_W + CULL_PAD ||
                dy + dh < camera.y - CULL_PAD || dy > camera.y + VIEW_H + CULL_PAD
              ) {
                return 0;
              }
              const image = atlas.get(atlasId);
              if (!image) return 0;
              ctx.save();
              ctx.translate(
                viewport.x - camera.x * viewport.scale,
                viewport.y - camera.y * viewport.scale,
              );
              ctx.scale(viewport.scale, viewport.scale);
              if (flipX > 0) {
                ctx.translate(dx + dw, dy);
                ctx.scale(-1, 1);
                ctx.drawImage(image, sx, sy, sw, sh, 0, 0, dw, dh);
              } else {
                ctx.drawImage(image, sx, sy, sw, sh, dx, dy, dw, dh);
              }
              ctx.restore();
              return 1;
            },
            gpu_present: () => 1,
            audio_play: () => 1,
            audio_music: () => 1,
          },
        };
      }

      async function loadImage(src) {
        const image = new Image();
        image.src = new URL(src, import.meta.url);
        await image.decode();
        return image;
      }

      async function loadAssets() {
        await Promise.all([...atlasSources].map(async ([id, src]) => {
          atlas.set(id, await loadImage(src));
        }));
      }

      function wasmUrl(cacheKey = "") {
        const url = new URL("./brackeys_platformer.wasm", import.meta.url);
        if (cacheKey) url.searchParams.set("v", cacheKey);
        return url;
      }

      async function readWasmSignature() {
        const response = await fetch(wasmUrl("probe"), {
          cache: "no-store",
          method: "HEAD",
        });
        if (!response.ok) return "";
        return [
          response.headers.get("last-modified") ?? "",
          response.headers.get("content-length") ?? "",
          response.headers.get("etag") ?? "",
        ].join("|");
      }

      async function loadWasm(cacheKey = "") {
        const response = await fetch(wasmUrl(cacheKey || String(Date.now())), {
          cache: "no-store",
        });
        if (!response.ok) throw new Error(`failed to load wasm: ${response.status}`);
        const { instance } = await WebAssembly.instantiate(
          await response.arrayBuffer(),
          hostImports(),
        );
        return instance.exports;
      }

      function pushReplayFrame(dt) {
        replayLog.push({ kind: "frame", dt });
      }

      function replayWorld(nextExports) {
        let nextWorld = nextExports.init_world();
        for (const event of replayLog) {
          if (event.kind === "key") {
            nextWorld = nextExports.input_key(...nextWorld, event.key, event.down);
          } else if (event.kind === "pointer") {
            nextWorld = nextExports.input_pointer(
              ...nextWorld,
              event.axis,
              event.jump,
              event.active,
            );
          } else if (event.kind === "frame") {
            nextWorld = nextExports.step_world(...nextWorld, event.dt);
          }
        }
        return nextWorld;
      }

      async function reloadWasm(nextSignature = "") {
        if (reloadPending) return;
        reloadPending = true;
        try {
          nextSignature = nextSignature || await readWasmSignature();
          if (nextSignature && wasmSignature && nextSignature !== wasmSignature) {
            const nextExports = await loadWasm(String(Date.now()));
            const nextWorld = replayWorld(nextExports);
            exports = nextExports;
            world = nextWorld;
            wasmSignature = await readWasmSignature() || nextSignature;
            updateCamera();
            exports.render_world(1, canvas.clientWidth, canvas.clientHeight, ...world);
            updateMeters();
          } else if (nextSignature && !wasmSignature) {
            wasmSignature = nextSignature;
          }
        } catch (error) {
          console.warn("hot reload failed", error);
        } finally {
          reloadPending = false;
        }
      }

      function startPollingReload() {
        if (hmrFallbackTimer) return;
        hmrFallbackTimer = setInterval(() => reloadWasm(), HOT_RELOAD_MS);
      }

      function stopPollingReload() {
        if (!hmrFallbackTimer) return;
        clearInterval(hmrFallbackTimer);
        hmrFallbackTimer = undefined;
      }

      function connectHotReload() {
        if (!("WebSocket" in globalThis)) {
          startPollingReload();
          return;
        }
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        hmrSocket = new WebSocket(`${protocol}//${location.host}/__fig_hmr`);
        hmrSocket.addEventListener("open", stopPollingReload);
        hmrSocket.addEventListener("message", (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === "wasm-changed") reloadWasm(message.signature);
          } catch (error) {
            console.warn("bad hot reload message", error);
          }
        });
        hmrSocket.addEventListener("close", () => {
          startPollingReload();
          setTimeout(connectHotReload, 1000);
        });
        hmrSocket.addEventListener("error", () => {
          startPollingReload();
        });
      }

      function resizeCanvas() {
        const availableWidth = Math.max(1, innerWidth - STAGE_PAD - CANVAS_BORDER);
        const availableHeight = Math.max(1, innerHeight - 44 - STAGE_PAD - CANVAS_BORDER);
        const cssScale = Math.max(
          1,
          Math.min(
            MAX_SCALE,
            Math.floor(availableWidth / VIEW_W),
            Math.floor(availableHeight / VIEW_H),
          ),
        );
        const cssWidth = VIEW_W * cssScale;
        const cssHeight = VIEW_H * cssScale;
        if (canvas.style.width !== `${cssWidth}px`) canvas.style.width = `${cssWidth}px`;
        if (canvas.style.height !== `${cssHeight}px`) canvas.style.height = `${cssHeight}px`;

        const ratio = Math.max(1, Math.min(devicePixelRatio || 1, 2));
        const width = Math.max(1, Math.floor(canvas.clientWidth * ratio));
        const height = Math.max(1, Math.floor(canvas.clientHeight * ratio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        return ratio;
      }

      function drawBackdrop() {
        const ratio = resizeCanvas();
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const scale = Math.floor(Math.max(1, Math.min(width / VIEW_W, height / VIEW_H)));
        const x = Math.floor((width - VIEW_W * scale) / 2);
        const y = Math.floor((height - VIEW_H * scale) / 2);

        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.fillStyle = "#101820";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#6fb6d8";
        ctx.fillRect(x, y, VIEW_W * scale, VIEW_H * scale);
        return { x, y, scale };
      }

      function updateCamera() {
        if (!exports || !world) return;
        const playerCenterX = exports.player_x(...world) + 16;
        const playerCenterY = exports.player_y(...world) + CAMERA_OFFSET_Y;
        camera = {
          x: playerCenterX - VIEW_W / 2,
          y: Math.min(playerCenterY - VIEW_H / 2, CAMERA_LIMIT_BOTTOM - VIEW_H),
        };
      }

      function updateMeters() {
        axisMeter.textContent = `axis ${exports.input_axis(...world)}`;
        jumpMeter.textContent = `jump ${exports.input_jump(...world)}`;
        coinMeter.textContent = `coins ${exports.coin_count(...world)}`;
        frameMeter.textContent = `dt ${Math.round(lastDt)}`;
      }

      function frame(now) {
        lastDt = Math.max(1, Math.min(32, Math.round(now - lastFrame)));
        lastFrame = now;
        pushReplayFrame(lastDt);
        world = exports.step_world(...world, lastDt);
        exports.render_world(1, canvas.clientWidth, canvas.clientHeight, ...world);
        updateMeters();
        requestAnimationFrame(frame);
      }

      viewport = drawBackdrop();

      try {
        await loadAssets();
        wasmSignature = await readWasmSignature();
        exports = await loadWasm();
        world = exports.init_world();
        updateCamera();
        viewport = drawBackdrop();
        exports.render_world(1, canvas.clientWidth, canvas.clientHeight, ...world);
        updateMeters();
        canvas.focus();
        connectHotReload();
        requestAnimationFrame((now) => {
          lastFrame = now;
          frame(now);
        });
      } catch (error) {
        console.error(error);
        frameMeter.textContent = "load failed";
      }
    </script>
  </body>
</html>
